apiVersion: v1
kind: ConfigMap
metadata:
  name: phase2-spark-script
  namespace: etl-research-phase2
data:
  spark_wallet_pipeline.py: |
    from pyspark.sql import SparkSession
    from pyspark.sql.functions import col, from_json, lit, struct, to_json, when
    from pyspark.sql.types import DoubleType, StringType, StructField, StructType

    spark = (
        SparkSession.builder
        .appName("spark-k8s-phase2-wallet-pipeline")
        .master("local[2]")
        .getOrCreate()
    )
    spark.sparkContext.setLogLevel("WARN")

    schema = StructType([
        StructField("event_id", StringType()),
        StructField("event_type", StringType()),
        StructField("wallet_id", StringType()),
        StructField("amount", DoubleType()),
        StructField("currency", StringType()),
    ])

    source = (
        spark.readStream
        .format("kafka")
        .option("kafka.bootstrap.servers", "phase2-redpanda:9092")
        .option("subscribe", "phase2-spark-wallet-events-v2")
        .option("startingOffsets", "earliest")
        .load()
    )

    events = (
        source
        .select(from_json(col("value").cast("string"), schema).alias("event"))
        .select("event.*")
    )

    filtered = (
        events
        .where((col("event_type") == "wallet.payment.authorized") & (col("amount") >= 100))
        .withColumn("risk_tier", when(col("amount") >= 1000, lit("HIGH")).otherwise(lit("STANDARD")))
        .withColumn("pipeline", lit("spark-k8s-phase2"))
    )

    output = filtered.select(
        col("event_id").cast("string").alias("key"),
        to_json(struct("*")).alias("value"),
    )

    query = (
        output.writeStream
        .format("kafka")
        .option("kafka.bootstrap.servers", "phase2-redpanda:9092")
        .option("topic", "phase2-spark-wallet-filtered-v2")
        .option("checkpointLocation", "/tmp/spark-wallet-checkpoint")
        .trigger(availableNow=True)
        .start()
    )
    query.awaitTermination(90)
    spark.stop()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase2-spark
  namespace: etl-research-phase2
  labels:
    app: phase2-spark
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: phase2-spark
    spec:
      restartPolicy: Never
      containers:
        - name: spark
          image: apache/spark:latest
          env:
            - name: HOME
              value: /tmp
          command:
            - /opt/spark/bin/spark-submit
          args:
            - --conf
            - spark.jars.ivy=/tmp/.ivy2
            - --conf
            - spark.local.dir=/tmp/spark-local
            - --packages
            - org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.2
            - /app/spark_wallet_pipeline.py
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: phase2-spark-script
