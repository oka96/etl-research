apiVersion: v1
kind: ConfigMap
metadata:
  name: phase2-mosquitto-config
  namespace: etl-research-phase2
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase2-mosquitto
  namespace: etl-research-phase2
  labels:
    app: phase2-mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phase2-mosquitto
  template:
    metadata:
      labels:
        app: phase2-mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2.0.22
          ports:
            - name: mqtt
              containerPort: 1883
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config
          readinessProbe:
            tcpSocket:
              port: mqtt
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: phase2-mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: phase2-mosquitto
  namespace: etl-research-phase2
spec:
  selector:
    app: phase2-mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: mqtt
