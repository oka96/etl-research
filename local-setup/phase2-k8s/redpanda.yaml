apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase2-redpanda
  namespace: etl-research-phase2
  labels:
    app: phase2-redpanda
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phase2-redpanda
  template:
    metadata:
      labels:
        app: phase2-redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:v25.2.9
          args:
            - redpanda
            - start
            - --mode
            - dev-container
            - --overprovisioned
            - --smp
            - "1"
            - --memory
            - 768M
            - --reserve-memory
            - 0M
            - --check=false
            - --kafka-addr
            - PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr
            - PLAINTEXT://phase2-redpanda.etl-research-phase2.svc.cluster.local:9092
          ports:
            - name: kafka
              containerPort: 9092
            - name: admin
              containerPort: 9644
          readinessProbe:
            httpGet:
              path: /v1/status/ready
              port: admin
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 900Mi
            limits:
              cpu: "1"
              memory: 1200Mi
---
apiVersion: v1
kind: Service
metadata:
  name: phase2-redpanda
  namespace: etl-research-phase2
spec:
  selector:
    app: phase2-redpanda
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: admin
      port: 9644
      targetPort: admin
