apiVersion: v1
kind: ConfigMap
metadata:
  name: phase2-streampark-proof
  namespace: etl-research-phase2
data:
  run-streampark.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    cd /streampark
    if [ ! -d apache-streampark_2.12-2.1.5-incubating-bin ]; then
      curl -fsSL -o /tmp/streampark.tar.gz \
        https://archive.apache.org/dist/incubator/streampark/2.1.5/apache-streampark_2.12-2.1.5-incubating-bin.tar.gz
      tar -xzf /tmp/streampark.tar.gz
    fi

    cd /streampark/apache-streampark_2.12-2.1.5-incubating-bin
    mkdir -p /tmp/streampark logs temp
    sed -i 's/h2-data-dir: ~\\/streampark\\/h2-data/h2-data-dir: \\/tmp\\/streampark\\/h2-data/' conf/config.yaml
    sed -i 's/worker: 256/worker: 16/' conf/config.yaml
    printf '%s\n' '-Xms256m' '-Xmx768m' > bin/jvm_opts.sh
    exec bin/streampark.sh start_docker
  run-flink-sql.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    source /work/topics.env

    mkdir -p /work/lib
    curl -fsSL \
      -o /work/lib/flink-sql-connector-kafka-3.4.0-1.20.jar \
      https://repo1.maven.org/maven2/org/apache/flink/flink-sql-connector-kafka/3.4.0-1.20/flink-sql-connector-kafka-3.4.0-1.20.jar

    /opt/flink/bin/start-cluster.sh
    for _ in $(seq 1 60); do
      if curl -fsS http://127.0.0.1:8081/overview >/work/flink-overview.json 2>/dev/null \
        && grep -Eq '"slots-total":[1-9]' /work/flink-overview.json; then
        break
      fi
      sleep 2
    done
    test -s /work/flink-overview.json
    cat /work/flink-overview.json

    cat >/work/job.sql <<EOF
    SET 'execution.runtime-mode' = 'batch';
    SET 'parallelism.default' = '1';
    SET 'table.dml-sync' = 'true';
    SET 'pipeline.name' = 'phase2-streampark-wallet-flink-sql';

    CREATE TABLE wallet_source (
      event_id STRING,
      event_type STRING,
      wallet_id STRING,
      amount DECIMAL(12,2),
      currency STRING,
      status STRING
    ) WITH (
      'connector' = 'kafka',
      'topic' = '$SOURCE_TOPIC',
      'properties.bootstrap.servers' = '$BROKERS',
      'properties.group.id' = '$GROUP_ID-source',
      'scan.startup.mode' = 'earliest-offset',
      'scan.bounded.mode' = 'latest-offset',
      'format' = 'json',
      'json.ignore-parse-errors' = 'true'
    );

    CREATE TABLE wallet_filtered (
      event_id STRING,
      event_type STRING,
      wallet_id STRING,
      amount DECIMAL(12,2),
      currency STRING,
      risk_tier STRING,
      pipeline STRING
    ) WITH (
      'connector' = 'kafka',
      'topic' = '$SINK_TOPIC',
      'properties.bootstrap.servers' = '$BROKERS',
      'format' = 'json'
    );

    INSERT INTO wallet_filtered
    SELECT
      event_id,
      event_type,
      wallet_id,
      amount,
      currency,
      CASE WHEN amount >= 1000 THEN 'HIGH' ELSE 'STANDARD' END AS risk_tier,
      'streampark-flink-sql-k8s-phase2' AS pipeline
    FROM wallet_source
    WHERE event_type = 'wallet.payment.authorized' AND amount >= 100;
    EOF

    /opt/flink/bin/sql-client.sh embedded \
      -j /work/lib/flink-sql-connector-kafka-3.4.0-1.20.jar \
      -f /work/job.sql
    /opt/flink/bin/stop-cluster.sh || true
  verify-topics.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    source /work/topics.env

    echo "Flink overview:"
    cat /work/flink-overview.json
    echo

    echo "Source topic: $SOURCE_TOPIC"
    timeout 15 rpk topic consume "$SOURCE_TOPIC" --brokers "$BROKERS" --offset start -n 4 >/tmp/source.jsonl
    cat /tmp/source.jsonl

    echo "Sink topic: $SINK_TOPIC"
    timeout 15 rpk topic consume "$SINK_TOPIC" --brokers "$BROKERS" --offset start -n 2 >/tmp/sink.jsonl
    cat /tmp/sink.jsonl

    echo "Verified StreamPark console plus Flink SQL Kafka source -> JSON filter/enrich -> Kafka sink"
    sleep 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase2-streampark
  namespace: etl-research-phase2
  labels:
    app: phase2-streampark
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phase2-streampark
  template:
    metadata:
      labels:
        app: phase2-streampark
    spec:
      containers:
        - name: streampark
          image: flink:1.20.1-scala_2.12-java17
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /config/run-streampark.sh
          ports:
            - name: http
              containerPort: 10000
          volumeMounts:
            - name: config
              mountPath: /config
            - name: streampark-home
              mountPath: /streampark
      volumes:
        - name: config
          configMap:
            name: phase2-streampark-proof
        - name: streampark-home
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: phase2-streampark
  namespace: etl-research-phase2
  labels:
    app: phase2-streampark
spec:
  selector:
    app: phase2-streampark
  ports:
    - name: http
      port: 10000
      targetPort: 10000
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase2-streampark-proof
  namespace: etl-research-phase2
  labels:
    app: phase2-streampark-proof
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: phase2-streampark-proof
    spec:
      restartPolicy: Never
      initContainers:
        - name: prepare-topics
          image: redpandadata/redpanda:v25.2.9
          command:
            - /bin/bash
            - -lc
          args:
            - |
              set -euo pipefail
              RUN_ID="$(date +%s)"
              BROKERS="phase2-redpanda:9092"
              SOURCE_TOPIC="phase2-streampark-wallet-events-${RUN_ID}"
              SINK_TOPIC="phase2-streampark-wallet-filtered-${RUN_ID}"
              GROUP_ID="phase2-streampark-wallet-poc-${RUN_ID}"
              cat >/work/topics.env <<EOF
              BROKERS=$BROKERS
              SOURCE_TOPIC=$SOURCE_TOPIC
              SINK_TOPIC=$SINK_TOPIC
              GROUP_ID=$GROUP_ID
              EOF
              rpk topic create "$SOURCE_TOPIC" --brokers "$BROKERS" || true
              rpk topic create "$SINK_TOPIC" --brokers "$BROKERS" || true
              cat >/tmp/wallet-events.jsonl <<'EOF'
              {"event_id":"evt-streampark-k8s-001","event_type":"wallet.payment.authorized","wallet_id":"wallet-streampark-001","amount":250.50,"currency":"MYR","status":"authorized"}
              {"event_id":"evt-streampark-k8s-002","event_type":"wallet.payment.rejected","wallet_id":"wallet-streampark-002","amount":880.00,"currency":"MYR","status":"rejected"}
              {"event_id":"evt-streampark-k8s-003","event_type":"wallet.payment.authorized","wallet_id":"wallet-streampark-003","amount":80.00,"currency":"MYR","status":"authorized"}
              {"event_id":"evt-streampark-k8s-004","event_type":"wallet.payment.authorized","wallet_id":"wallet-streampark-004","amount":1500.00,"currency":"MYR","status":"authorized"}
              EOF
              rpk topic produce "$SOURCE_TOPIC" --brokers "$BROKERS" </tmp/wallet-events.jsonl
              cat /work/topics.env
          volumeMounts:
            - name: work
              mountPath: /work
        - name: run-flink-sql
          image: flink:1.20.1-scala_2.12-java17
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /config/run-flink-sql.sh
          volumeMounts:
            - name: config
              mountPath: /config
            - name: work
              mountPath: /work
      containers:
        - name: verify-topics
          image: redpandadata/redpanda:v25.2.9
          command:
            - /bin/bash
            - /config/verify-topics.sh
          volumeMounts:
            - name: config
              mountPath: /config
            - name: work
              mountPath: /work
      volumes:
        - name: config
          configMap:
            name: phase2-streampark-proof
        - name: work
          emptyDir: {}
