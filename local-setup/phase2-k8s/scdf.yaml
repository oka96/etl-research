apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase2-scdf-skipper
  namespace: etl-research-phase2
  labels:
    app: phase2-scdf-skipper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phase2-scdf-skipper
  template:
    metadata:
      labels:
        app: phase2-scdf-skipper
    spec:
      containers:
        - name: skipper
          image: springcloud/spring-cloud-skipper-server:2.9.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7577
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: phase2-scdf-skipper
  namespace: etl-research-phase2
  labels:
    app: phase2-scdf-skipper
spec:
  selector:
    app: phase2-scdf-skipper
  ports:
    - name: http
      port: 7577
      targetPort: 7577
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phase2-scdf-dataflow
  namespace: etl-research-phase2
  labels:
    app: phase2-scdf-dataflow
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: phase2-scdf-dataflow
  template:
    metadata:
      labels:
        app: phase2-scdf-dataflow
    spec:
      containers:
        - name: dataflow
          image: springcloud/spring-cloud-dataflow-server:2.10.2
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_CLOUD_SKIPPER_CLIENT_SERVER_URI
              value: http://phase2-scdf-skipper:7577/api
            - name: SPRING_CLOUD_DATAFLOW_APPLICATIONPROPERTIES_STREAM_SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
              value: phase2-redpanda:9092
            - name: SPRING_CLOUD_DATAFLOW_APPLICATIONPROPERTIES_STREAM_SPRING_CLOUD_STREAM_KAFKA_STREAMS_BINDER_BROKERS
              value: phase2-redpanda:9092
          ports:
            - name: http
              containerPort: 9393
          readinessProbe:
            httpGet:
              path: /about
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: phase2-scdf-dataflow
  namespace: etl-research-phase2
  labels:
    app: phase2-scdf-dataflow
spec:
  selector:
    app: phase2-scdf-dataflow
  ports:
    - name: http
      port: 9393
      targetPort: 9393
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: phase2-scdf-proof
  namespace: etl-research-phase2
data:
  run-proof.sh: |
    #!/usr/bin/env bash
    set -euo pipefail

    RUN_ID="$(date +%s)"
    BROKERS="phase2-redpanda:9092"
    SOURCE_TOPIC="phase2-scdf-wallet-events-${RUN_ID}"
    SINK_TOPIC="phase2-scdf-wallet-filtered-${RUN_ID}"
    GROUP_ID="phase2-scdf-wallet-poc-${RUN_ID}"

    rpk topic create "$SOURCE_TOPIC" --brokers "$BROKERS" || true
    rpk topic create "$SINK_TOPIC" --brokers "$BROKERS" || true

    java -jar /app/app.jar \
      --server.port=18086 \
      --spring.cloud.stream.kafka.binder.brokers="$BROKERS" \
      --spring.cloud.stream.bindings.walletFilterEnrich-in-0.destination="$SOURCE_TOPIC" \
      --spring.cloud.stream.bindings.walletFilterEnrich-in-0.group="$GROUP_ID" \
      --spring.cloud.stream.bindings.walletFilterEnrich-out-0.destination="$SINK_TOPIC" >/work/scdf-wallet-stream.log 2>&1 &
    APP_PID="$!"
    trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

    for _ in $(seq 1 300); do
      if curl -fsS http://127.0.0.1:18086/actuator/health >/work/scdf-wallet-health.json 2>/dev/null; then
        break
      fi
      sleep 2
    done
    test -s /work/scdf-wallet-health.json

    cat >/tmp/wallet-events.jsonl <<'EOF'
    {"event_id":"evt-scdf-k8s-001","event_type":"wallet.payment.authorized","wallet_id":"wallet-scdf-001","amount":250.50,"currency":"MYR","status":"authorized"}
    {"event_id":"evt-scdf-k8s-002","event_type":"wallet.payment.rejected","wallet_id":"wallet-scdf-002","amount":880.00,"currency":"MYR","status":"rejected"}
    {"event_id":"evt-scdf-k8s-003","event_type":"wallet.payment.authorized","wallet_id":"wallet-scdf-003","amount":80.00,"currency":"MYR","status":"authorized"}
    {"event_id":"evt-scdf-k8s-004","event_type":"wallet.payment.authorized","wallet_id":"wallet-scdf-004","amount":1500.00,"currency":"MYR","status":"authorized"}
    EOF
    rpk topic produce "$SOURCE_TOPIC" --brokers "$BROKERS" </tmp/wallet-events.jsonl

    echo "Data Flow about:"
    for _ in $(seq 1 90); do
      if curl -fsS http://phase2-scdf-dataflow:9393/about >/work/scdf-dataflow-about.json 2>/dev/null; then
        break
      fi
      sleep 2
    done
    test -s /work/scdf-dataflow-about.json
    cat /work/scdf-dataflow-about.json
    echo
    echo "Spring Cloud Stream app health:"
    cat /work/scdf-wallet-health.json
    echo

    echo "Source topic: $SOURCE_TOPIC"
    timeout 15 rpk topic consume "$SOURCE_TOPIC" --brokers "$BROKERS" --offset start -n 4 >/work/source.jsonl
    cat /work/source.jsonl

    echo "Sink topic: $SINK_TOPIC"
    timeout 60 rpk topic consume "$SINK_TOPIC" --brokers "$BROKERS" --offset start -n 2 >/work/sink.jsonl
    cat /work/sink.jsonl

    grep -q 'evt-scdf-k8s-001' /work/sink.jsonl
    grep -q 'evt-scdf-k8s-004' /work/sink.jsonl
    grep -q 'STANDARD' /work/sink.jsonl
    grep -q 'HIGH' /work/sink.jsonl
    grep -q 'scdf-spring-cloud-stream-k8s-phase2' /work/sink.jsonl

    echo "Spring Cloud Stream transform log lines:"
    grep -E 'Started ScdfWalletStreamApplication|Published enriched wallet event|Filtered event' /work/scdf-wallet-stream.log
    echo "Verified SCDF runtime plus Spring Cloud Stream Kafka source -> JSON filter/enrich -> Kafka sink"
    sleep 20
---
apiVersion: batch/v1
kind: Job
metadata:
  name: phase2-scdf-proof
  namespace: etl-research-phase2
  labels:
    app: phase2-scdf-proof
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: phase2-scdf-proof
    spec:
      restartPolicy: Never
      containers:
        - name: run-proof
          image: etl-research/scdf-wallet-stream:phase2
          imagePullPolicy: Never
          command:
            - /bin/bash
            - /config/run-proof.sh
          volumeMounts:
            - name: config
              mountPath: /config
            - name: work
              mountPath: /work
      volumes:
        - name: config
          configMap:
            name: phase2-scdf-proof
        - name: work
          emptyDir: {}
