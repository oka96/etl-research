services:
  redpanda:
    image: redpandadata/redpanda:latest
    container_name: etl-research-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
    ports:
      - "19092:9092"

  redpanda-console:
    image: redpandadata/console:latest
    container_name: etl-research-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "18080:8080"
    depends_on:
      - redpanda

  kafka-connect:
    image: apache/kafka:latest
    container_name: etl-research-kafka-connect
    command:
      - /opt/kafka/bin/connect-distributed.sh
      - /etc/kafka-connect/connect-distributed.properties
    ports:
      - "18083:8083"
    volumes:
      - ./kafka-connect-distributed.properties:/etc/kafka-connect/connect-distributed.properties:ro
    depends_on:
      - redpanda

  bento:
    image: ghcr.io/warpstreamlabs/bento:latest
    container_name: etl-research-bento
    command:
      - -c
      - /etc/bento/wallet-pipeline.yaml
    ports:
      - "14195:4195"
    volumes:
      - ./bento-wallet-pipeline.yaml:/etc/bento/wallet-pipeline.yaml:ro
    depends_on:
      - redpanda

  ekuiper:
    image: lfedge/ekuiper:latest
    container_name: etl-research-ekuiper
    ports:
      - "19081:9081"
    depends_on:
      - redpanda

  camel-wallet:
    build:
      context: ./camel-wallet-pipeline
    image: etl-research/camel-wallet-pipeline:local
    container_name: etl-research-camel-wallet
    command:
      - --wallet.kafka.brokers=redpanda:9092
      - --server.port=18084
    ports:
      - "18084:18084"
    depends_on:
      - redpanda

  flink-jobmanager:
    image: flink:1.20.1-scala_2.12-java17
    container_name: etl-research-flink-jobmanager
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    ports:
      - "18081:8081"

  flink-taskmanager:
    image: flink:1.20.1-scala_2.12-java17
    container_name: etl-research-flink-taskmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    depends_on:
      - flink-jobmanager

  node-red:
    image: nodered/node-red:latest
    container_name: etl-research-node-red
    ports:
      - "1880:1880"

  nifi:
    image: apache/nifi:latest
    container_name: etl-research-nifi
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: adminadminadmin
      NIFI_WEB_PROXY_HOST: localhost:18443
    ports:
      - "18443:8443"

  spark-master:
    image: apache/spark:latest
    container_name: etl-research-spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "17077:7077"
      - "18088:8080"
    profiles:
      - extended

  spark-worker:
    image: apache/spark:latest
    container_name: etl-research-spark-worker
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
    ports:
      - "18089:8081"
    depends_on:
      - spark-master
    profiles:
      - extended

  pulsar:
    image: apachepulsar/pulsar:latest
    container_name: etl-research-pulsar
    command:
      - bin/pulsar
      - standalone
    environment:
      PULSAR_MEM: "-Xms512m -Xmx512m -XX:MaxDirectMemorySize=512m"
    ports:
      - "16650:6650"
      - "18085:8080"
    profiles:
      - extended

  rocketmq-namesrv:
    image: apache/rocketmq:latest
    container_name: etl-research-rocketmq-namesrv
    command:
      - nameserver
    environment:
      HEAP_OPTS: "-Xms256m -Xmx256m -Xmn128m"
    ports:
      - "19876:9876"
    profiles:
      - rocketmq

  rocketmq-broker:
    image: apache/rocketmq:latest
    container_name: etl-research-rocketmq-broker
    command:
      - broker
      - -n
      - rocketmq-namesrv:9876
      - -c
      - /home/rocketmq/conf/broker.conf
    environment:
      HEAP_OPTS: "-Xms512m -Xmx512m -Xmn256m -XX:MaxDirectMemorySize=256m"
    volumes:
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    depends_on:
      - rocketmq-namesrv
    profiles:
      - rocketmq

  rocketmq-dashboard:
    image: apacherocketmq/rocketmq-dashboard:latest
    container_name: etl-research-rocketmq-dashboard
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dserver.port=8082"
    ports:
      - "18086:8082"
    depends_on:
      - rocketmq-namesrv
      - rocketmq-broker
    profiles:
      - rocketmq
